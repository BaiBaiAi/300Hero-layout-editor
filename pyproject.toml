[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "300hero-layout-editor"
version = "1.0.1"
description = "300英雄大厅布局编辑器"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "300Hero Layout Editor contributors"}]
dependencies = ["Pillow>=10.0"]

[project.scripts]
300hero-editor = "app:main"

[tool.setuptools]
py-modules = ["app", "jmp_core", "hall_scene", "lua_patch", "additional_options", "resource_export", "settings_store", "version_history"]
